services:
  gofly:
    build: .
    image: goflylivechat:latest
    container_name: goflylivechat
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - GIN_MODE=release
      - TZ=Asia/Shanghai
    # 让容器内可以通过 host.docker.internal 访问宿主机（如 MySQL 装在宿主机上）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 数据库配置（宿主机可编辑，改完 docker compose restart gofly 生效）
      - ./config/mysql.json:/app/config/mysql.json
      # 自动生成的 JWT/session 密钥，挂载出来避免重启后 token 全部失效
      - ./config/server.json:/app/config/server.json
      # 聊天上传的图片/文件持久化
      - ./data/upload:/app/static/upload
      # 日志
      - ./logs:/app/logs
